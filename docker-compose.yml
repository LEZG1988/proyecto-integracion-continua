services:
  # Contenedor 2: base de datos (imagen propia basada en PostgreSQL oficial)
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - red-proyecto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Contenedor 1: la aplicación
  api:
    build: ./api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-proyecto
    healthcheck:
      # Solo comprueba que el servidor responde; la conexión con db la verifican las pruebas
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(() => process.exit(0), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Pruebas de integración: se ejecutan con "docker compose run --rm pruebas"
  pruebas:
    build: ./pruebas
    profiles: ["pruebas"]
    environment:
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - red-proyecto

networks:
  red-proyecto:
    # Jenkins usa otro nombre para no chocar con el entorno local
    name: ${RED_NOMBRE:-red-proyecto}

volumes:
  pgdata:
